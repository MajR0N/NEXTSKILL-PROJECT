// ns_gotv_test.cfg — GOTV fidelity vs size test (V15 half 1b)
//
// Answers: does raising tv_snapshotrate (or enabling fat demos) make a GOTV
// demo good enough for AIM analysis — and what does it cost in megabytes?
//
// If yes, CS2 gets a forensic artefact we hold ourselves, no client
// cooperation needed, and V15's "can the server force `record`?" stops
// mattering for CS2. That is why this test is worth more than the others.
//
// PUT IT IN:  .../Counter-Strike Global Offensive/game/csgo/cfg/
// RUN IT:     exec ns_gotv_test
//
// ponytail: three recordings and a directory listing, not a study. Ceiling:
// file size is a proxy for how much got captured, and eyeballing a flick is
// not a detector. Upgrade path: parse both demos and diff the angle series —
// worth it only once there is a detector to feed.

echo "== ns_gotv_test =="

// --- GOTV on, and recording that does not wait ---------------------------
// tv_delay is 105 in competitive (cfg/gamemode_competitive.cfg). Without
// _immediate the demo would be missing its first 105 seconds.
tv_enable 1
tv_record_immediate 1
tv_autorecord 0

// --- report the things we are about to change ---------------------------
// These print current values. WRITE THEM DOWN — the defaults are what run A
// is measuring, and they are what a Valve update can move under us.
echo "--- defaults, record these ---"
help tv_snapshotrate
help tv_enable
help tv_delay
help csgo_fatdemo_enable

// --- a bot game so both runs are comparable -----------------------------
// Same map, same bots, same duration is what makes the file sizes mean
// anything. Humans are not needed: this measures capture rate, not behaviour.
sv_cheats 1
bot_kick
bot_quota_mode fill
bot_quota 10
mp_limitteams 0
mp_autoteambalance 0
mp_warmup_end
mp_roundtime 60
mp_roundtime_defuse 60
mp_freezetime 5
mp_restartgame 1

echo "== ready =="
echo "Run A: tv_snapshotrate <default>  then  tv_record ns_gotv_a"
echo "Run B: tv_snapshotrate 64         then  tv_record ns_gotv_b"
echo "Run C: csgo_fatdemo_enable true   then  tv_record ns_gotv_c"
echo "Each run: EXACTLY 5 minutes, then tv_stoprecord. Same map, same bots."
echo "Kill a few bots each run so there is a real flick to compare."
